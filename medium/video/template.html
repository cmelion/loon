<title>Loon Over Europe</title>
<style>
  /* Layout: one 16:9 stage, Europe map in map space with a screen-space overlay; transport bar beneath. Single dark look. */
  :root {
    --bg: #0a101c; --land: #1a2538; --landline: #26334a; --ink: #e8edf5; --dim: #8a97ad; --accent: #4a9eff;
    --warm: #f2c94c; --cold: #7fd1ff; --balloon: #cc66ff; --glide: #00e8a0; --miss: #ff5d5d; --panel: #0d1626; --panelline: #26334a;
    --font: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; color-scheme: dark;
  }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: var(--font); }
  #wrap { max-width: 1600px; margin: 0 auto; padding-block: 0 12px; }
  #stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; background: var(--bg); }
  #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #controls { display: flex; gap: 12px; align-items: center; justify-content: center; padding: 12px 16px; flex-wrap: wrap; }
  #controls button { font: inherit; font-size: 15px; padding: 8px 18px; border-radius: 6px; border: 1px solid #33425e; background: #142036; color: var(--ink); cursor: pointer; }
  #controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #controls input[type=range] { flex: 1; min-width: 160px; max-width: 640px; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 14px; min-width: 90px; }
  #note { text-align: center; color: var(--dim); font-size: 13px; padding: 0 16px 8px; }
  body.capture #controls, body.capture #note { display: none; }
  body.capture #wrap { max-width: none; padding: 0; }
  body.capture #stage { width: 1920px; height: 1080px; aspect-ratio: auto; }
  .cap { font-size: 34px; font-weight: 500; }
  .lbl { font-size: 26px; fill: var(--ink); }
  .small { font-size: 21px; fill: var(--dim); }
  .head { font-size: 54px; font-weight: 700; fill: var(--ink); letter-spacing: -0.5px; }
  .mono { font-variant-numeric: tabular-nums; }
</style>
<div id="wrap">
<div id="stage">
  <svg id="map" viewBox="120 390 800 450" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <g id="landG"></g>
    <path id="borders" fill="none" stroke="var(--landline)" stroke-width="0.5"/>
    <path id="region" fill="none" stroke="#51617f" stroke-width="0.8" stroke-dasharray="3 3" opacity="0"/>
    <g id="trailG"></g>
    <g id="trackG"></g>
    <g id="glideG"></g>
    <g id="siteG"></g>
    <g id="launchG"></g>
  </svg>
  <svg id="ov" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="capbg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0a101c" stop-opacity="0"/>
        <stop offset="1" stop-color="#0a101c" stop-opacity="0.92"/>
      </linearGradient>
    </defs>
    <g id="ovG"></g>
    <rect x="0" y="840" width="1920" height="240" fill="url(#capbg)"/>
    <text id="brand" x="60" y="70" class="small" style="font-size:22px;letter-spacing:3px;fill:#8a97ad">LOON OVER EUROPE · 2025 WINDS · SIMULATION</text>
    <text id="srcTag" x="1860" y="70" class="small" text-anchor="end" style="font-size:18px">Simulated tracks · BLE 1.0.1 · GFS 2025 · 2.5° × 5° grid</text>
    <g id="capG"></g>
  </svg>
</div>
<div id="controls">
  <button id="play" type="button">Play</button>
  <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Timeline">
  <span id="time">0:00</span>
</div>
<div id="note">Narrated, captioned. Every track is a simulated flight from the repository's 2025 runs; nothing here flew.</div>
</div>
<audio id="aud" preload="auto" src="__AUDIO__"></audio>
<script>
const D = __DATA__;
const SEGS = __SEGS__;
const TOTAL = __TOTAL__;
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = x => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, p) => a + (b - a) * p;
const S = Object.fromEntries(SEGS.map(s => [s.id, s]));
const since = (t, id) => t - S[id].start;
const frac = (t, id) => (t - S[id].start) / S[id].dur;
const fade = (t, a, b, o1, o2) => { let v = clamp((t - a) / (b - a)); if (o1 !== undefined) v *= 1 - clamp((t - o1) / (o2 - o1)); return v; };
const set = (e, o) => e.setAttribute('opacity', clamp(o));
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const SITE_COL = { Lisbon: '#f2c94c', Brest: '#7fd1ff', Dublin: '#00e8a0', Vienna: '#ff8c42', Bucharest: '#ff4daa' };

// ---- static map (neutral: every country the same) ----
const landG = $('landG');
D.land.forEach(l => el('path', { d: l.d, fill: 'var(--land)', stroke: 'var(--landline)', 'stroke-width': 0.4 }, landG));
el('path', { d: D.russia, fill: 'var(--land)', stroke: 'var(--landline)', 'stroke-width': 0.4 }, landG);
el('path', { d: D.ukraine, fill: 'var(--land)', stroke: 'var(--landline)', 'stroke-width': 0.4 }, landG);
$('borders').setAttribute('d', D.borders);
$('region').setAttribute('d', 'M' + D.region.map(p => p.join(',')).join('L') + 'Z');

// launch sites and recovery sites
const launchEls = Object.entries(D.launch).map(([n, [x, y]]) => {
  const g = el('g', { opacity: 0 }, $('launchG'));
  el('circle', { cx: x, cy: y, r: 2.4, fill: SITE_COL[n], stroke: '#0a101c', 'stroke-width': 0.6 }, g);
  const tx = el('text', { x: x + 4, y: y - 3, 'font-size': 7, fill: '#e8edf5' }, g); tx.textContent = n;
  return g;
});
const siteEls = Object.entries(D.sites).filter(([n]) => n !== 'Black Sea (mid)').map(([n, [x, y]]) => {
  const g = el('g', { opacity: 0 }, $('siteG'));
  el('rect', { x: x - 1.8, y: y - 1.8, width: 3.6, height: 3.6, fill: 'var(--glide)', transform: `rotate(45 ${x} ${y})` }, g);
  return g;
});

// tracks: one polyline per flight, revealed by hours elapsed
const tracks = D.tracks.map(tk => {
  const d = 'M' + tk.pts.map(p => p.join(',')).join('L');
  const trail = el('path', { d, fill: 'none', stroke: SITE_COL[tk.site], 'stroke-width': 0.9, 'stroke-opacity': 0.22, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0 }, $('trailG'));
  const line = el('path', { d, fill: 'none', stroke: SITE_COL[tk.site], 'stroke-width': 1.3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: 0 }, $('trackG'));
  const head = el('circle', { r: 1.8, fill: '#fff', opacity: 0 }, $('trackG'));
  const len = line.getTotalLength(), hours = tk.pts.length - 1;
  return { ...tk, trail, line, head, len, hours };
});
// draw a track up to h simulated hours (linear in points: tracks are hourly)
function drawTrack(tk, h, op = 1, trailOp = 0) {
  const p = clamp(h / tk.hours);
  const shown = tk.len * p;
  tk.line.setAttribute('stroke-dasharray', `${shown} ${tk.len + 1}`);
  set(tk.line, op * (p > 0 ? 1 : 0));
  set(tk.trail, trailOp);
  if (p > 0 && p < 1 && op > 0) { const pt = tk.line.getPointAtLength(shown); tk.head.setAttribute('cx', pt.x); tk.head.setAttribute('cy', pt.y); set(tk.head, op); } else set(tk.head, 0);
}
const byMonth = m => tracks.filter(t => t.month === m);

// glider scene: release points → recovery site, slow controller only
const MISS = new Set(['Brest_2025-04-01', 'Brest_2025-08-01']);   // never within glide range of a site (glider_tuning.md ceiling)
const trackByKey = Object.fromEntries(tracks.map(tk => [`${tk.site}_${tk.start.slice(0, 10)}`, tk]));
const glides = D.drift.filter(r => r.ctl === 'slow' && (r.rel || MISS.has(`${r.site}_${r.start}`))).map(r => {
  const miss = MISS.has(`${r.site}_${r.start}`);
  const site = !miss && r.rec && D.sites[r.rec] ? D.sites[r.rec] : null;
  const tk = trackByKey[`${r.site}_${r.start}`];
  const rel = r.rel || (tk ? tk.pts[tk.pts.length - 1] : null);
  return { ...r, rel, site, miss };
}).filter(g => g.rel);
const glideEls = glides.map(g => {
  const grp = el('g', { opacity: 0 }, $('glideG'));
  if (g.site) el('line', { x1: g.rel[0], y1: g.rel[1], x2: g.site[0], y2: g.site[1], stroke: 'var(--glide)', 'stroke-width': 0.7, 'stroke-opacity': 0.75 }, grp);
  el('circle', { cx: g.rel[0], cy: g.rel[1], r: g.miss ? 2.6 : 1.4, fill: g.site ? 'var(--glide)' : 'var(--miss)', stroke: g.miss ? '#fff' : 'none', 'stroke-width': 0.5 }, grp);
  return grp;
});
const nMiss = glides.filter(g => g.miss).length;

// ---- overlay ----
const ov = $('ovG');
function txt(x, y, s, cls, attrs = {}) { const t = el('text', Object.assign({ x, y, class: cls }, attrs), ov); t.textContent = s; return t; }
const head1 = txt(60, 160, 'A year of real winds', 'head', { opacity: 0 });
const sub1 = txt(60, 210, '360 one-way flights · 5 launch sites · 2 a month · 2025', 'lbl', { opacity: 0, fill: '#bcd6ff' });
const head2 = txt(60, 160, 'January', 'head', { opacity: 0 });
const sub2 = txt(60, 210, 'Westerly at every reachable height · nothing to steer with', 'lbl', { opacity: 0, fill: '#bcd6ff' });
const head3 = txt(60, 160, 'June', 'head', { opacity: 0 });
const sub3 = txt(60, 210, 'The band goes quiet · the same controller lingers', 'lbl', { opacity: 0, fill: '#bcd6ff' });
const head4 = txt(60, 160, 'A conveyor, not a hover', 'head', { opacity: 0 });
const sub4 = txt(60, 210, 'Launched upwind · crossing slowly · replaced', 'lbl', { opacity: 0, fill: '#bcd6ff' });
const plate5 = el('rect', { x: 40, y: 108, width: 1300, height: 130, rx: 12, fill: '#0a101c', opacity: 0 }, ov);
const head5 = txt(60, 160, 'The radio glides home', 'head', { opacity: 0 });
const sub5 = txt(60, 210, '', 'lbl', { opacity: 0, fill: '#9ff3d2' });
const clock = txt(60, 300, '', 'head mono', { opacity: 0, style: 'font-size:46px;fill:#e8edf5' });
const clockLbl = txt(60, 340, 'simulated time since launch', 'small', { opacity: 0 });

// monthly dwell bars (slow controller)
const bars = el('g', { opacity: 0 }, ov);
const BX = 1330, BY = 820, BW = 36, BG = 8, BH = 260, DMAX = 15;
el('rect', { x: BX - 30, y: BY - BH - 110, width: 12 * (BW + BG) + 60, height: BH + 170, rx: 14, fill: 'var(--panel)', stroke: 'var(--panelline)', 'stroke-width': 2, opacity: 0.94 }, bars);
el('text', { x: BX - 6, y: BY - BH - 70, class: 'small', style: 'font-size:18px' }, bars).textContent = 'DAYS OVER THE REGION PER FLIGHT · SLOW CONTROLLER';
el('line', { x1: BX - 6, y1: BY, x2: BX + 12 * (BW + BG), y2: BY, stroke: '#51617f', 'stroke-width': 2 }, bars);
const barEls = MONTHS.map((m, i) => {
  const g = el('g', { opacity: 0.25 }, bars);
  const r = el('rect', { x: BX + i * (BW + BG), y: BY, width: BW, height: 0, fill: i >= 3 && i <= 8 ? 'var(--warm)' : 'var(--cold)' }, g);
  el('text', { x: BX + i * (BW + BG) + BW / 2, y: BY + 26, class: 'small', 'text-anchor': 'middle', style: 'font-size:18px' }, g).textContent = m;
  const v = el('text', { x: BX + i * (BW + BG) + BW / 2, y: BY - 8, class: 'small mono', 'text-anchor': 'middle', style: 'font-size:17px;fill:#e8edf5' }, g);
  return { g, r, v };
});
const barNote = el('text', { x: BX - 6, y: BY + 56, class: 'small', style: 'font-size:18px' }, bars); barNote.textContent = 'Source: results/drift_2025.csv · winter 1.5–2.5 d, summer 6–14 d';

// cost table (s6)
const cost = el('g', { opacity: 0 }, ov);
el('rect', { x: 0, y: 0, width: 1920, height: 1080, fill: '#0a101c', opacity: 0.86 }, cost);
el('text', { x: 60, y: 160, class: 'head' }, cost).textContent = 'Release timing is the cost';
el('text', { x: 60, y: 210, class: 'lbl', fill: '#bcd6ff' }, cost).textContent = 'Useful days per flight, launch-rate weighted, and the fleet cost it implies';
const ROWS = [['As first costed', 'no release loss', '3.65 d', '€3.4 B / yr'], ['Hindsight release', 'best possible', '2.48 d', '€5.0 B / yr'], ['5-day forecast', 'the planning case', '1.98 d', '€6.3 B / yr'], ['1-day forecast', '', '0.91 d', '€13.6 B / yr']];
const rowEls = ROWS.map((r, i) => {
  const y = 330 + i * 86, g = el('g', { opacity: 0 }, cost);
  const hi = i === 2;
  el('rect', { x: 60, y: y - 52, width: 1180, height: 72, rx: 10, fill: hi ? '#1a2a1f' : 'var(--panel)', stroke: hi ? 'var(--glide)' : 'var(--panelline)', 'stroke-width': hi ? 2 : 1.5 }, g);
  el('text', { x: 90, y, class: 'lbl' }, g).textContent = r[0];
  el('text', { x: 440, y, class: 'small', style: 'font-size:22px' }, g).textContent = r[1];
  el('text', { x: 900, y, class: 'lbl mono', 'text-anchor': 'end' }, g).textContent = r[2];
  el('text', { x: 1210, y, class: 'lbl mono', 'text-anchor': 'end', fill: hi ? '#9ff3d2' : '#e8edf5', style: 'font-weight:700' }, g).textContent = r[3];
  return g;
});
el('text', { x: 60, y: 700, class: 'small', style: 'font-size:18px' }, cost).textContent = 'Source: TECHNICAL_ISSUES.md §1, forecast_release.py · recovery 98 % in every row; the coverage spent reaching glide range is what changes';
const unp = el('g', { opacity: 0 }, cost);
el('text', { x: 1320, y: 300, class: 'small' }, unp).textContent = 'STILL UNPROVEN';
[['Radio capacity', '2 Gbps per balloon is an assumption'], ['Thin envelope', '25–30 µm film at 1,000 Pa, at volume'], ['Light vehicle', 'costed at 40 kg, never flown in the model']].forEach(([a, b], i) => {
  el('text', { x: 1320, y: 350 + i * 100, class: 'lbl' }, unp).textContent = a;
  el('text', { x: 1320, y: 384 + i * 100, class: 'small', style: 'font-size:20px' }, unp).textContent = b;
});

// captions
const capG = $('capG');
const capLines = [el('text', { x: 960, y: 960, class: 'cap', 'text-anchor': 'middle', fill: '#fff' }, capG), el('text', { x: 960, y: 1010, class: 'cap', 'text-anchor': 'middle', fill: '#fff' }, capG)];
SEGS.forEach(s => {
  const sentences = s.text.match(/[^.!?]+[.!?]+/g).map(x => x.trim().split(' '));
  const cards = [];
  sentences.forEach(w => { const last = cards[cards.length - 1]; if (last && last.length + w.length <= 15) last.push(...w); else if (w.length <= 15) cards.push([...w]); else { const n = Math.ceil(w.length / 13), k = Math.ceil(w.length / n); for (let i = 0; i < w.length; i += k) cards.push(w.slice(i, i + k)); } });
  const tot = cards.reduce((a, c) => a + c.length, 0); let acc = 0;
  s.chunks = cards.map(c => { const a = acc / tot; acc += c.length; return { words: c, a, b: acc / tot }; });
});
function captions(t) {
  const s = SEGS.find(s => t >= s.start - 0.05 && t < s.start + s.dur + 0.35);
  if (!s) { capLines.forEach(l => l.textContent = ''); return; }
  const p = clamp((t - s.start) / s.dur);
  const ch = s.chunks.find(c => p >= c.a && p <= c.b + 1e-6) || s.chunks[s.chunks.length - 1];
  const half = ch.words.length > 8 ? Math.ceil(ch.words.length / 2) : ch.words.length;
  capLines[0].textContent = ch.words.slice(0, half).join(' '); capLines[1].textContent = ch.words.slice(half).join(' ');
}

// ---- render ----
const fmtDays = h => (h / 24).toFixed(1) + ' days';
function render(t) {
  const f1 = frac(t, 's1'), f2 = frac(t, 's2'), f3 = frac(t, 's3'), f4 = frac(t, 's4'), f5 = frac(t, 's5');
  const inS = id => t >= S[id].start && t < (SEGS[SEGS.indexOf(S[id]) + 1] || { start: 1e9 }).start;

  // s1: region, launch sites, then all tracks as a faint web
  set($('region'), fade(t, S.s1.start + 0.5, S.s1.start + 1.3, S.s6.start - 0.3, S.s6.start));
  launchEls.forEach((g, i) => set(g, fade(t, S.s1.start + 2.5 + i * 0.25, S.s1.start + 3.0 + i * 0.25, S.s6.start - 0.3, S.s6.start)));
  set(head1, fade(t, S.s1.start + 0.4, S.s1.start + 1.1, S.s2.start - 0.4, S.s2.start));
  set(sub1, fade(t, S.s1.start + 2.2, S.s1.start + 2.8, S.s2.start - 0.4, S.s2.start));
  const webOp = fade(t, S.s1.start + 0.62 * S.s1.dur, S.s1.start + 0.62 * S.s1.dur + 1.2, S.s2.start, S.s2.start + 0.8);

  // s2: winter (Jan–Mar) tracks animate; clock in days
  // s3: summer (Jun–Jul) tracks animate
  // s4: every month in sequence, trails accumulate, bars build
  let hWinter = 0, hSummer = 0;
  if (inS('s2')) hWinter = clamp((since(t, 's2') - 1.0) / (S.s2.dur - 1.5)) * 72;            // 3 days over the scene
  if (inS('s3')) hSummer = clamp((since(t, 's3') - 1.0) / (S.s3.dur - 1.5)) * 14 * 24;       // 14 days over the scene
  const perMonth = (S.s4.dur - 1.0) / 12;
  const s4m = inS('s4') ? clamp((since(t, 's4') - 0.6) / (S.s4.dur - 1.0)) * 12 : -1;        // 0..12 months elapsed
  tracks.forEach(tk => {
    let h = 0, op = 0, trailOp = webOp * 0.9;
    if (inS('s2') && tk.month <= 3) { h = hWinter; op = 1; }
    if (inS('s3') && (tk.month === 6 || tk.month === 7)) { h = hSummer; op = 1; }
    if (inS('s4') && s4m >= 0) {
      const mi = tk.month - 1;
      if (s4m >= mi + 1) { trailOp = 0.9; }
      else if (s4m > mi) { h = (s4m - mi) * tk.hours; op = 1; }
    }
    if (inS('s5') || t >= S.s6.start) { trailOp = inS('s5') ? 0.35 : 0; }
    drawTrack(tk, h, op, trailOp);
  });
  set(head2, fade(t, S.s2.start + 0.3, S.s2.start + 1.0, S.s3.start - 0.4, S.s3.start));
  set(sub2, fade(t, S.s2.start + 3.0, S.s2.start + 3.6, S.s3.start - 0.4, S.s3.start));
  set(head3, fade(t, S.s3.start + 0.3, S.s3.start + 1.0, S.s4.start - 0.4, S.s4.start));
  set(sub3, fade(t, S.s3.start + 2.6, S.s3.start + 3.2, S.s4.start - 0.4, S.s4.start));
  const clockOp = fade(t, S.s2.start + 1.0, S.s2.start + 1.5, S.s3.start - 0.3, S.s3.start) + fade(t, S.s3.start + 1.0, S.s3.start + 1.5, S.s4.start - 0.3, S.s4.start);
  set(clock, clockOp); set(clockLbl, clockOp);
  clock.textContent = inS('s2') ? fmtDays(hWinter) : inS('s3') ? fmtDays(hSummer) : '';
  set(head4, fade(t, S.s4.start + 0.3, S.s4.start + 1.0, S.s5.start - 0.4, S.s5.start));
  set(sub4, fade(t, S.s4.start + 2.5, S.s4.start + 3.1, S.s5.start - 0.4, S.s5.start));
  set(bars, fade(t, S.s4.start + 0.3, S.s4.start + 1.0, S.s5.start - 0.3, S.s5.start));
  barEls.forEach((b, i) => {
    const p = clamp(s4m - i);
    const v = D.monthDwell.slow[i];
    b.r.setAttribute('height', BH * (v / DMAX) * ease(p)); b.r.setAttribute('y', BY - BH * (v / DMAX) * ease(p));
    b.v.textContent = p >= 1 ? v.toFixed(1) : '';
    set(b.g, p > 0 ? 1 : 0.25);
  });

  // s5: glides
  const n5 = glideEls.length;
  glideEls.forEach((g, i) => set(g, fade(t, S.s5.start + 1.0 + (i / n5) * 0.5 * S.s5.dur, S.s5.start + 1.4 + (i / n5) * 0.5 * S.s5.dur, S.s6.start - 0.3, S.s6.start)));
  siteEls.forEach((g, i) => set(g, fade(t, S.s5.start + 0.4 + i * 0.05, S.s5.start + 0.8 + i * 0.05, S.s6.start - 0.3, S.s6.start)));
  set(head5, fade(t, S.s5.start + 0.3, S.s5.start + 1.0, S.s6.start - 0.4, S.s6.start));
  set(plate5, 0.78 * fade(t, S.s5.start + 0.3, S.s5.start + 1.0, S.s6.start - 0.4, S.s6.start));
  const s5late = fade(t, S.s5.start + 0.62 * S.s5.dur, S.s5.start + 0.62 * S.s5.dur + 0.6, S.s6.start - 0.4, S.s6.start);
  set(sub5, s5late); sub5.textContent = `98.3 % recovered with full-column winds · ${nMiss} releases never within range of a site`;

  // s6: cost
  set(cost, fade(t, S.s6.start + 0.2, S.s6.start + 0.9));
  rowEls.forEach((g, i) => set(g, fade(t, S.s6.start + 0.28 * S.s6.dur + i * 1.1, S.s6.start + 0.28 * S.s6.dur + 0.6 + i * 1.1)));
  set(unp, fade(t, S.s6.start + 0.74 * S.s6.dur, S.s6.start + 0.74 * S.s6.dur + 0.8));
  $('map').style.opacity = 1 - 0.75 * fade(t, S.s6.start, S.s6.start + 0.9);
  captions(t);
}
window.render = render; window.TOTAL = TOTAL;

// ---- player ----
const aud = $('aud'), playBtn = $('play'), scrub = $('scrub'), timeEl = $('time');
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function tick() { const t = aud.currentTime; render(t); scrub.value = Math.round(t / TOTAL * 1000); timeEl.textContent = fmt(t) + ' / ' + fmt(TOTAL); if (!aud.paused) requestAnimationFrame(tick); }
playBtn.onclick = () => { if (aud.paused) { if (aud.ended) aud.currentTime = 0; aud.play(); playBtn.textContent = 'Pause'; tick(); } else { aud.pause(); playBtn.textContent = 'Play'; } };
aud.onended = () => { playBtn.textContent = 'Replay'; };
scrub.oninput = () => { aud.currentTime = scrub.value / 1000 * TOTAL; tick(); };
timeEl.textContent = '0:00 / ' + fmt(TOTAL);
render(0.0001);
</script>
